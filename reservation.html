<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reservation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/style.css" rel="stylesheet">
  </head>
  <body>
    <!-- 공통 네비게이션 -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold" href="home.html">🏫 Bus</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="home.html">즐겨찾기</a></li>
            <li class="nav-item"><a class="nav-link" href="routes.html">노선조회</a></li>
            <li class="nav-item"><a class="nav-link" href="my.html">내 예약</a></li>
          </ul>
          <div class="d-flex align-items-center gap-3">
            <span id="navUser" class="text-secondary small"></span>
            <button class="btn btn-outline-secondary btn-sm" onclick="App.logout()">로그아웃</button>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4" id="resvMain">
      <h2 class="h5" id="resvTitle">예약</h2>
      <div class="row g-3 mt-1">
        <div class="col-sm-4">
          <label class="form-label">날짜 선택</label>
          <input type="date" class="form-control" id="resvDate">
        </div>
        <div class="col-sm-4">
          <label class="form-label">인원</label>
          <input type="number" class="form-control" id="resvCount" value="1" min="1" max="4">
        </div>
      </div>
      <div id="fareInfo" class="mt-2 text-secondary small"></div> <!-- 요금/총금액 표시 -->
      <button class="btn btn-primary mt-3" onclick="App.makeReservation()">예약하기</button>

      <div id="resvAlert" class="alert alert-success d-none mt-3"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/app.js"></script>
    <script>App.page('reservation');</script>
  </body>
</html>
