<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bus Reservation UI (Prototype)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/style.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-5" style="max-width:460px;">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h1 class="h4 fw-bold mb-3 text-center">학교 버스 예약</h1>
          <p class="text-secondary text-center mb-4">DB 없이 동작하는 UI 프로토타입</p>
          <form onsubmit="return App.login(event)">
            <div class="mb-3">
              <label class="form-label">학번 또는 아이디</label>
              <input type="text" class="form-control" id="userId" required placeholder="ex) 201800001">
            </div>
            <div class="mb-3">
              <label class="form-label">비밀번호</label>
              <input type="password" class="form-control" id="userPw" required placeholder="ex) 1234">
            </div>
            <button class="btn btn-primary w-100">로그인</button>
          </form>
        </div>
      </div>
      <p class="text-center mt-3 small text-secondary">* 지금은 학번/비번을 아무 값이나 넣어도 로그인됨 (UI 연습용)</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
